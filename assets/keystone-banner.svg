<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Keystone</title>
  <desc id="desc">An arch of stones held together by a highlighted central keystone, next to the words Keystone and Context is architecture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)" opacity="0.6"/>
  <circle cx="300" cy="110" r="120" fill="url(#glow)"/>
  <g>
    <path d="M 208.0,265.4 L 132.1,263.3 A 168 168 0 0 1 140.6,215.0 L 212.7,239.0 A 92 92 0 0 0 208.0,265.4 Z" fill="url(#stone)" stroke="#334155" stroke-width="1.5"/>
    <path d="M 214.5,234.1 L 143.8,206.2 A 168 168 0 0 1 168.3,163.6 L 227.9,210.9 A 92 92 0 0 0 214.5,234.1 Z" fill="url(#stone)" stroke="#334155" stroke-width="1.5"/>
    <path d="M 231.2,206.9 L 174.4,156.5 A 168 168 0 0 1 212.0,124.9 L 251.8,189.6 A 92 92 0 0 0 231.2,206.9 Z" fill="url(#stone)" stroke="#334155" stroke-width="1.5"/>
    <path d="M 256.2,187.1 L 220.1,120.2 A 168 168 0 0 1 266.2,103.4 L 281.5,177.9 A 92 92 0 0 0 256.2,187.1 Z" fill="url(#stone)" stroke="#334155" stroke-width="1.5"/>
    <path d="M 287.4,182.9 L 272.8,84.0 A 186 186 0 0 1 327.2,84.0 L 312.6,182.9 A 86 86 0 0 0 287.4,182.9 Z" fill="url(#key)" stroke="#fbbf24" stroke-width="1.5"/>
    <path d="M 318.5,177.9 L 333.8,103.4 A 168 168 0 0 1 379.9,120.2 L 343.8,187.1 A 92 92 0 0 0 318.5,177.9 Z" fill="url(#stone)" stroke="#334155" stroke-width="1.5"/>
    <path d="M 348.2,189.6 L 388.0,124.9 A 168 168 0 0 1 425.6,156.5 L 368.8,206.9 A 92 92 0 0 0 348.2,189.6 Z" fill="url(#stone)" stroke="#334155" stroke-width="1.5"/>
    <path d="M 372.1,210.9 L 431.7,163.6 A 168 168 0 0 1 456.2,206.2 L 385.5,234.1 A 92 92 0 0 0 372.1,210.9 Z" fill="url(#stone)" stroke="#334155" stroke-width="1.5"/>
    <path d="M 387.3,239.0 L 459.4,215.0 A 168 168 0 0 1 467.9,263.3 L 392.0,265.4 A 92 92 0 0 0 387.3,239.0 Z" fill="url(#stone)" stroke="#334155" stroke-width="1.5"/>
    <rect x="126" y="268" width="88" height="44" fill="url(#stone)" stroke="#334155" stroke-width="1.5"/>
    <rect x="386" y="268" width="88" height="44" fill="url(#stone)" stroke="#334155" stroke-width="1.5"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="560" y="168" fill="#f8fafc" font-size="96" font-weight="800" letter-spacing="-2">Keystone</text>
    <text x="564" y="222" fill="#fbbf24" font-size="32" font-weight="600">Context is architecture.</text>
    <text x="564" y="266" fill="#94a3b8" font-size="22">A context architecture for AI software engineering</text>
  </g>
