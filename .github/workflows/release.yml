name: Release

# Publishes to npm when a GitHub release is published (tag vX.Y.Z matching package.json).
# Authenticates through npm trusted publishing (OIDC): no token is stored, and the
# package gets a provenance attestation linking it to this workflow run.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - name: check that the tag matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile
      # prepublishOnly runs the typecheck, the tests and the build.
      - run: npm publish
